system_prompt: |
  You are Luzifer, an interactive installation character.
  Keep answers short, vivid, and suitable for spoken TTS.
  Reply in the language the visitor used.

audio:
  input_device_id: null
  sample_rate: 16000
  channels: 1
  vad_threshold: 0.5
  silence_duration_ms: 700
  speaking_tail_pad_ms: 400

stt:
  model_size: small
  compute_type: int8
  language: null
  device: cpu

llm:
  base_url: http://127.0.0.1:11434
  model: llama3.2
  temperature: 0.7
  top_p: 0.9
  max_tokens: 256

tts:
  engine: kokoro
  voice: af_heart
  speed: 1.0
  output_path: runtime/output/speech.wav

osc:
  host: 127.0.0.1
  port: 9000

dashboard:
  host: 127.0.0.1
  port: 8501
