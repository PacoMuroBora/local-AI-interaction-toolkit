[project]
name = "luzifer"
version = "0.1.0"
description = "Local AI speech microservice for the Luzifer TouchDesigner installation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-osc>=1.8.3",
    "pyyaml>=6.0.2",
    "sounddevice>=0.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0.3"]
vad = ["torch>=2.2.0", "torchaudio>=2.2.0"]
tts = ["kokoro-onnx>=0.4.0", "piper-tts>=1.2.0"]
# ORT 1.30 CUDA EP needs CUDA 13 + cuDNN 9 pip wheels (not just a system CUDA 12 toolkit).
# Stop luzifer first, then: uv pip uninstall onnxruntime && uv sync --extra tts-gpu
tts-gpu = [
    "luzifer[tts]",
    "onnxruntime-gpu[cuda,cudnn]>=1.20.0",
]
vision = ["cyndilib>=0.0.14", "pillow>=10.0.0"]
all = ["luzifer[stt,vad,tts,vision]"]
all-gpu = ["luzifer[stt,vad,tts-gpu,vision]"]

[project.scripts]
luzifer = "luzifer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
